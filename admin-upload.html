<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samadii4KT Luxe</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0a0908;
    --panel: #17140f;
    --gold: #D4AF37;
    --gold-light: #F1DA9B;
    --gold-deep: #9C7A26;
    --cream: #F3EDDD;
    --cream-dim: #9c9280;
    --hairline: rgba(212,175,55,0.18);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:var(--black);
    color:var(--cream);
    font-family:'Jost', sans-serif;
    font-weight:300;
    min-height:100vh;
  }
  a{ color:inherit; text-decoration:none; }
  img{ max-width:100%; display:block; }

  .topbar{
    padding:22px 34px; border-bottom:1px solid var(--hairline);
    display:flex; align-items:center; gap:16px;
  }
  .topbar a{
    font-size:0.8rem; color:var(--cream-dim); display:flex; align-items:center; gap:6px;
  }
  .topbar a:hover{ color:var(--gold); }
  .topbar a svg{ width:16px; height:16px; }
  .topbar h1{ font-family:'Playfair Display', serif; font-size:1.15rem; }

  .wrap{ max-width:640px; margin:0 auto; padding:40px 24px 80px; }

  .lock{
    text-align:center; padding:50px 30px; border:1px solid var(--hairline); background:var(--panel); margin-bottom:34px;
  }
  .lock svg{ width:32px; height:32px; color:var(--gold); margin-bottom:14px; }
  .lock p{ color:var(--cream-dim); font-size:0.88rem; max-width:360px; margin:8px auto 0; line-height:1.6; }
  .lock .row{ max-width:320px; margin:22px auto 0; display:flex; gap:10px; }
  .lock input{
    flex:1; background:transparent; border:1px solid var(--hairline); color:var(--cream);
    padding:12px 14px; font-family:'Jost',sans-serif; outline:none;
  }
  .lock button{
    padding:12px 20px; border:none; cursor:pointer;
    background:linear-gradient(120deg, var(--gold-light), var(--gold) 60%, var(--gold-deep));
    color:#0a0908; font-weight:500; font-size:0.8rem; letter-spacing:0.06em; text-transform:uppercase;
  }

  .form-box{ border:1px solid var(--hairline); background:var(--panel); padding:38px 32px; display:none; }
  .field{ margin-bottom:24px; }
  .field label{
    display:block; font-size:0.7rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); margin-bottom:9px;
  }
  .field input, .field select, .field textarea{
    width:100%; background:transparent; border:1px solid var(--hairline); color:var(--cream);
    padding:12px 14px; font-family:'Jost',sans-serif; font-size:0.9rem; outline:none;
  }
  .field textarea{ resize:vertical; min-height:80px; }
  .dropzone{
    border:1.5px dashed var(--hairline); padding:36px 18px; text-align:center; color:var(--cream-dim);
    font-size:0.86rem; cursor:pointer;
  }
  .dropzone:hover{ border-color:var(--gold); color:var(--cream); }
  .dropzone svg{ width:26px; height:26px; margin-bottom:10px; color:var(--gold); }

  .submit-btn{
    width:100%; padding:14px; border:none; cursor:pointer; margin-top:6px;
    background:linear-gradient(120deg, var(--gold-light), var(--gold) 60%, var(--gold-deep));
    color:#0a0908; font-weight:500; font-size:0.82rem; letter-spacing:0.08em; text-transform:uppercase;
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="s4kt-mgr-7q2x.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>
    Back to Dashboard
  </a>
</div>

<div class="wrap">
  <h1 style="font-family:'Playfair Display', serif; font-size:1.4rem; margin-bottom:30px;">Upload New Work</h1>

  <div class="lock" id="lock">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
    <div style="font-family:'Playfair Display', serif; font-size:1.05rem;">Owner Access Only</div>
    <p>Enter your admin password to add new finished-work photos to the public Gallery.</p>
    <div class="row">
      <input type="password" id="keyInput" placeholder="Admin password">
      <button id="unlockBtn">Unlock</button>
    </div>
  </div>

  <form class="form-box" id="uploadForm">
    <div class="field">
      <label>Photo</label>
      <div class="dropzone" id="dropzone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
        <div id="dropzoneLabel">Click to upload a photo</div>
      </div>
      <input type="file" id="photoInput" accept="image/*" style="display:none;">
    </div>

    <div class="field">
      <label>Title</label>
      <input type="text" id="workTitle" placeholder="e.g. The Ikeja Classic — Oxford">
    </div>

    <div class="field">
      <label>Category</label>
      <select id="workCategory">
        <option>Men's</option>
        <option>Women's</option>
        <option>Native</option>
        <option>Bespoke / Custom</option>
      </select>
    </div>

    <div class="field">
      <label>Price</label>
      <input type="text" id="workPrice" placeholder="e.g. ₦45,000 or From ₦60,000 for bespoke">
    </div>

    <div class="field">
      <label>Location</label>
      <input type="text" id="workLocation" placeholder="e.g. Lagos, Nigeria or client's delivery city">
    </div>

    <div class="field">
      <label>Short Description (optional)</label>
      <textarea id="workDescription" placeholder="A short note about this piece."></textarea>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Add To Gallery</button>
  </form>
</div>

<script>
  const API_BASE = 'https://shoemaker.onrender.com/api';

  function getAdminKey() {
    return sessionStorage.getItem('s4kt_admin_key') || '';
  }

  async function readResponse(res) {
    const text = await res.text();

    try {
      return text ? JSON.parse(text) : {};
    } catch {
      return { error: text || `Server returned status ${res.status}` };
    }
  }

  const lock = document.getElementById('lock');
  const formBox = document.getElementById('uploadForm');
  const keyInput = document.getElementById('keyInput');
  const unlockBtn = document.getElementById('unlockBtn');

  function showForm() {
    lock.style.display = 'none';
    formBox.style.display = 'block';
  }

  function showLock() {
    lock.style.display = 'block';
    formBox.style.display = 'none';
  }

  async function tryUnlock() {
    const key = keyInput.value.trim() || getAdminKey();

    if (!key) {
      alert('Please enter the admin password.');
      return;
    }

    unlockBtn.disabled = true;
    unlockBtn.textContent = 'Checking...';

    try {
      // Assumes /orders is a protected admin endpoint
      const check = await fetch(`${API_BASE}/orders`, {
        method: 'GET',
        headers: {
          'x-admin-key': key
        }
      });

      const data = await readResponse(check);

      if (!check.ok) {
        sessionStorage.removeItem('s4kt_admin_key');

        if (check.status === 401 || check.status === 403) {
          alert('Incorrect password. Please try again.');
        } else {
          alert(data.error || `Unable to verify access. Server status: ${check.status}`);
        }

        return;
      }

      sessionStorage.setItem('s4kt_admin_key', key);
      showForm();

    } catch (err) {
      console.error('Unlock error:', err);
      alert('Could not reach the server. Check your internet connection and try again.');
    } finally {
      unlockBtn.disabled = false;
      unlockBtn.textContent = 'Unlock';
    }
  }

  unlockBtn.addEventListener('click', tryUnlock);

  keyInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      tryUnlock();
    }
  });

  // Do not automatically trust a saved key without server verification.
  // The user can enter it again when needed.
  // if (getAdminKey()) showForm();

  const dropzone = document.getElementById('dropzone');
  const photoInput = document.getElementById('photoInput');
  const dropzoneLabel = document.getElementById('dropzoneLabel');

  dropzone.addEventListener('click', () => photoInput.click());

  photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];

    if (file) {
      dropzoneLabel.textContent = `Selected: ${file.name}`;
    } else {
      dropzoneLabel.textContent = 'Click to upload a photo';
    }
  });

  document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const file = photoInput.files[0];

    if (!file) {
      alert('Please choose a photo to upload.');
      return;
    }

    const btn = document.getElementById('submitBtn');
    const originalText = btn.textContent;

    btn.textContent = 'Uploading...';
    btn.disabled = true;

    const formData = new FormData();

    // IMPORTANT: This name must match your backend multer/upload field name.
    formData.append('photo', file);

    formData.append('title', document.getElementById('workTitle').value.trim());
    formData.append('category', document.getElementById('workCategory').value);
    formData.append('price', document.getElementById('workPrice').value.trim());
    formData.append('location', document.getElementById('workLocation').value.trim());
    formData.append('description', document.getElementById('workDescription').value.trim());

    try {
      const res = await fetch(`${API_BASE}/gallery`, {
        method: 'POST',
        headers: {
          'x-admin-key': getAdminKey()
          // Do NOT manually add Content-Type here.
          // The browser sets multipart/form-data and its boundary automatically.
        },
        body: formData
      });

      const data = await readResponse(res);

      if (res.ok) {
        alert('Added to the Gallery successfully!');
        document.getElementById('uploadForm').reset();
        dropzoneLabel.textContent = 'Click to upload a photo';
        return;
      }

      if (res.status === 401 || res.status === 403) {
        sessionStorage.removeItem('s4kt_admin_key');
        showLock();
        alert('Your admin session has expired or the password is incorrect.');
        return;
      }

      console.error('Upload failed:', res.status, data);
      alert(data.error || `Upload failed. Server status: ${res.status}`);

    } catch (err) {
      console.error('Upload network error:', err);
      alert('Could not reach the server. Please try again shortly.');
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
